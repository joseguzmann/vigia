# Vigía configuration. Copy to config/vigia.yaml (git-ignored) and adapt it to yourself.
# The collector stores everything it finds; this file only decides how jobs are
# flagged and ranked, so you can change it later without collecting again.

profile:
  # Role families from config/vocabulary.yaml (synonyms in EN/ES/PT, normalized matching).
  role_families: [ai, backend, fullstack, frontend, mobile]
  # Extra title terms on top of the families, if any.
  title_include: []
  # Titles that are never what we want, even if they match above.
  title_exclude:
    - intern
    - internship
    - sales
    - account executive
    - marketing
    - recruiter
    - designer
    - support agent
    - customer support
    - ios engineer
    - android engineer
    - swift
    - kotlin developer
    - ".net"
    - php
    - product manager
    - program manager
    - director
    - vice president
    - head of
    - insurance agent

  # Country the candidate lives in. When a source lists the exact countries a remote role
  # accepts, the role is eligible only if this country is on the list.
  home_country: Ecuador
  # On-site or hybrid roles here are fine (the rest of the world counts as office-bound).
  home_cities: []

  # Where the candidate can work from. A job is eligible if its location or text
  # mentions one of these, or if it is remote with no stated restriction.
  eligible_regions:
    - worldwide
    - anywhere
    - global
    - latam
    - latin america
    - south america
    - americas
    - ecuador

  # Companies to never show, matched against the company name.
  company_exclude: []

  # Postings older than this are stale: often filled, or ghost listings.
  max_age_days: 45
  # Company boards (Greenhouse/Ashby/Lever) only list open roles, so allow more.
  max_age_days_boards: 120

  # Years of experience the candidate has. Jobs asking for more are marked "out".
  max_years: 4

  # Ranking by seniority in the title (not a filter). For ~4 years, mid-level converts better.
  level_bonus: {junior: 1, mid: 3, unstated: 1, senior: 0, lead: -2, principal: -4}

  # Skills the candidate has. Each one found in a posting adds to its score.
  stack:
    - python
    - fastapi
    - django
    - langgraph
    - langchain
    - rag
    - postgres
    - pgvector
    - typescript
    - node
    - docker
    - llm
    - agent
    - eval
    - langfuse
    - langsmith
    - rabbitmq
    - redis
    - aws

sources:
  getonbrd:
    enabled: true
    every_minutes: 180
    queries: [llm, ai engineer, langchain, agentes, python, backend, django]
  torre:
    # From the public sitemaps (robots.txt disallows /api/). Countries come from each posting.
    enabled: true
    every_minutes: 360
    days: 30
    sitemaps_en: 3
    sitemaps_es: 1
    max_posts: 60
  # Ecuador's local market. On-site/hybrid only pass in profile.home_cities.
  multitrabajos:
    enabled: true
    every_minutes: 240
    areas: [tecnologia-sistemas-y-telecomunicaciones]
  computrabajo:
    enabled: true
    every_minutes: 240
    pubdate: 30
  indeed:
    # Through the mobile app's GraphQL API (as JobSpy does). One request per search.
    enabled: true
    every_minutes: 240
    days: 30
    countries:
      - code: EC
        queries: [desarrollador, programador, python, software engineer, ingeniero de software,
                  full stack, backend, frontend, react, inteligencia artificial, AI engineer,
                  LLM, remote developer]
  # Company boards: companies that hire remotely in LATAM, plus remote-first AI companies.
  greenhouse:
    enabled: true
    every_minutes: 360
    boards: [coderoad, sezzle, wizeline, moduscreate, nortal, turing, vtex, clara, gitlab, vercel]
  ashby:
    enabled: true
    every_minutes: 360
    boards: [truelogic, andela, terminal, oyster, fullstack, addi, nubank, mastra, elevenlabs,
             supabase, posthog, langchain, n8n, zapier, modal, sierra, decagon, cohere]
  lever:
    enabled: true
    every_minutes: 360
    boards: [tekton, oowlish, toptal, kavak]
  workday:
    # Large companies: searched with `queries`, full text fetched only for new in-scope titles.
    enabled: true
    every_minutes: 720
    boards: [stord/wd503/Stord_External_Career, proofpoint/wd5/ProofpointCareers, netflix/wd108/Netflix,
             motorolasolutions/wd5/Careers, transnetwork/wd108/Transnetwork_Jobs, dxctechnology/wd1/DXCJobs,
             nvidia/wd5/NVIDIAExternalCareerSite, chevron/wd5/jobs, santander/wd3/SantanderCareers,
             salesforce/wd12/External_Career_Site, iqvia/wd1/iqvia, autodesk/wd1/Ext, jj/wd5/JJ,
             tsys/wd1/TSYS, rocket/wd5/rocket_careers, capitalone/wd12/Capital_One,
             assurant/wd1/Assurant_Careers, disney/wd5/disneycareer, mastercard/wd1/CorporateCareers]
  # More ATS (found 2026-10-15 by probing remote and LATAM companies; see docs/sources-research.md).
  teamtailor:
    enabled: true
    every_minutes: 360
    boards: [avenga, next, yonder, two, headway, akka, betterfly, varnish-software]
  workable:
    enabled: true
    every_minutes: 360
    boards: [platzi, on-the-go-systems, recurly]
  smartrecruiters:
    enabled: true
    every_minutes: 360
    boards: [endava, appen, skyrocketventures, uruit, testgorilla, firstpoint, timedoctor, nearform,
             sezzle, intevity, kinsta, dribbble, wovenware, bluecoding, oowlish, fiverr]
  breezy:
    enabled: true
    every_minutes: 360
    boards: [fluxit, boldare, gaggle, bear-group, cal-com, tekton]
  recruitee:
    enabled: true
    every_minutes: 360
    boards: [namecheap, aerolab, crazygames, ifit, testgorilla, coursera]
  bamboohr:
    # Public careers JSON per company ({slug}.bamboohr.com/careers/list); companies are added
    # by the discovery loads and openroles.
    enabled: true
    every_minutes: 360
    boards: []
  rippling:
    enabled: true
    every_minutes: 360
    boards: []
  manatal:
    # careers-page.com; many boards are recruiting agencies.
    enabled: true
    every_minutes: 360
    boards: []
  remoteok:
    enabled: true
    every_minutes: 360
  remotive:
    enabled: true
    every_minutes: 240
    queries: [python, backend, ai, llm, machine learning engineer]
  himalayas:
    enabled: true
    every_minutes: 240
    queries: [ai engineer, llm, python backend, agentic]
  freehire:
    # freehire.me public API (no key, ~600 requests/hour per address, personal use): jobs it
    # read from 100+ ATS and aggregators, with the eligible countries/regions already normalized.
    enabled: true
    every_minutes: 60
    open_within_days: 2
    # searches: default = Ecuador named as eligible (any category) + LATAM and global remote tech roles
  jobicy:
    enabled: true
    every_minutes: 360
  hn_whoishiring:
    enabled: true
    every_minutes: 720
  strider:
    # LATAM-only marketplace. Each role lists its countries; check that yours is there.
    enabled: true
    every_minutes: 720
  workingnomads:
    enabled: true
    every_minutes: 360
  weworkremotely:
    enabled: true
    every_minutes: 360
  linkedin_session:
    # LinkedIn's post search with a signed-in account made only for this, through the
    # linkedin-mcp container (docker compose --profile linkedin). Paced like a person:
    # per_day searches at random local times with min_gap_minutes between them, on `weekdays`
    # (0 = Monday), max_pages result pages each. Pauses itself on any login/captcha/verification page.
    enabled: false
    every_minutes: 10
    per_day: 2
    weekdays: [0, 1, 2, 3, 4]
    hours_local: [9, 19]
    min_gap_minutes: 90
    timezone: America/Guayaquil
    date_posted: past-24h
    max_pages: 1
    server_url: http://linkedin-mcp:8000/mcp
    phrases: [FastAPI, Python React, Django]
    # A template uses `phrases`, or its own list (a Spanish template needs Spanish phrases).
    templates:
      - '"hiring" AND {phrase} AND ("LATAM" OR "Latin America")'
      - template: '("buscamos" OR "contratando") AND {phrase} AND (remoto OR LATAM)'
        phrases: [Python, FastAPI]
  openroles:
    # openroles.today (data CC BY-SA 4.0): nightly dataset of postings on ~54 ATS. Used to find
    # companies to watch (their boards are checked once, like discover) and to read postings on
    # ATS Vigía has no source for. Reads only the files covering the last `days` days.
    enabled: false
    every_minutes: 1440
    days: 2
    max_new_boards: 60
    max_pages: 40
  discover:
    # Finds companies to watch: Google (Serper) searches restricted to ATS job pages, e.g.
    # site:jobs.ashbyhq.com ("Latin America" OR LATAM) ("AI Engineer" OR LLM). Each new board is
    # read once; if a job passes the filters, the board is watched from then on (table
    # discovered_boards). queries_per_run Serper credits per run; the searches rotate.
    enabled: false
    every_minutes: 5040
    queries_per_run: 15
    max_new_per_run: 40
    freshness: qdr:m  # companies, not fresh postings: a month finds more boards
    ats: [ashby, greenhouse, lever, workable, teamtailor]
    regions:
      - '("Latin America" OR LATAM)'
      - '(remote Ecuador OR "South America")'
    roles:
      - '("AI Engineer" OR "LLM Engineer" OR "Applied AI")'
      - '(Python OR FastAPI OR Django) (Backend OR "Software Engineer")'
      - '("Full Stack" OR Fullstack) (Python OR TypeScript)'
  remoteyeah:
    # Listing pages (25 newest jobs each, server-rendered); only new titles in scope get their
    # page read (schema.org JobPosting with the accepted countries).
    enabled: true
    every_minutes: 360
    max_details: 40
    listings:
      - remote-jobs-in-latin-america
      - remote-python-jobs
      - remote-fastapi-jobs
      - remote-llms-jobs
      - remote-django-jobs
  linkedin_posts:
    # Hiring posts found through Serper (Google's index), read logged-out.
    # Needs SERPER_API_KEY in .env. Each run spends `queries_per_run` Serper credits.
    enabled: false
    every_minutes: 720
    queries_per_run: 6
    posted_within_days: 21
    freshness: qdr:m
    families: [ai, backend, fullstack, frontend, mobile]
    # Measured 2026-10-14: a bare "remote" returns US/India posts; naming LATAM (or writing
    # in Spanish) is what surfaces roles open to the region.
    templates:
      - 'site:linkedin.com/posts hiring "{phrase}" LATAM'
      - 'site:linkedin.com/posts hiring "{phrase}" "Latin America" remote'
      - 'site:linkedin.com/posts buscamos "{phrase}" remoto LATAM'
  linkedin_posts_apify:
    # LinkedIn's own post search (every post, newest first), run by an Apify actor on the
    # actor's accounts, never ours. Paid per post (~$0.002): needs APIFY_TOKEN in .env.
    # Capped per run (max_charge_per_run_usd, enforced by Apify) and per month (the run is
    # skipped once the account has spent monthly_budget_usd).
    # Run by hand: MCP search_linkedin_posts (searches chosen each time). If enabled, it also
    # runs on the schedule (hours_utc limits it to a UTC hour range), rotating the templates.
    enabled: false
    every_minutes: 1200
    queries_per_run: 1
    posts_per_query: 25
    date_posted: past-24h
    max_charge_per_run_usd: 0.06
    monthly_budget_usd: 2.0
    families: [ai, backend, fullstack]
    templates:
      - 'hiring "{phrase}" LATAM'
      - 'hiring "{phrase}" remote'
  linkedin:
    # Optional. Uses LinkedIn's public (logged-out) job search, one query per run,
    # and fetches only the descriptions of jobs that pass the title/location filter.
    # LinkedIn rate-limits by IP: keep it slow. `vigia throttle` shows how it is going.
    enabled: false
    every_minutes: 45
    hours_old: 48
    max_descriptions: 8
    # Requests left after the search fetch the text of jobs stored earlier without it
    # (throttled), newest first, up to this many days back.
    backlog_days: 14
    pause_seconds: [6, 12]
    # After a 429 every LinkedIn source waits this long (measured: ~3 h).
    cooldown_minutes: 200
    request_budget: 12
    queries:
      - {keywords: AI Engineer, location: Ecuador}
      - {keywords: LLM Engineer, location: Latin America}
      - {keywords: Python Backend Engineer, location: Ecuador}
  gmail:
    # Optional. Reads your mailbox read-only (Gmail API, gmail.readonly) and classifies every
    # new message: job alerts (their postings go through the filter like any source), replies
    # to applications, recruiter messages, "review". Anything else is kept as its id only.
    # The token is created on your own machine (README, "Email") and mounted from ./secrets.
    enabled: false
    every_minutes: 15
    token_file: /app/secrets/gmail-token.json
    since: "2026-10-12"   # the first run reads from this day
    max_messages: 300     # per run; the rest waits for the next one
    max_postings: 40      # posting links opened per run

# Phone notifications for new "fit" jobs through ntfy (NTFY_URL and NTFY_TOKEN in .env).
notify:
  quiet_hours: [22, 8]      # local time; nothing is sent in between
  timezone: America/Guayaquil
  max_per_run: 5            # the rest of a run's new fits go into one summary message

# Quick pass over the companies that posted something kept (fit, review, extra) in the last
# `days`: read every `every_minutes` on top of each source's full run, so their new roles show
# up within minutes instead of hours.
hot_boards:
  every_minutes: 20
  days: 60
  sources: [greenhouse, ashby, lever, workable, teamtailor, smartrecruiters, breezy, recruitee, bamboohr, rippling, manatal, workday]

# An LLM reads each new fit/review/extra against the CV and scores it 1-10 (see src/vigia/reader.py).
# new_jobs is ordered by it, and only good open roles notify the phone. CV files are plain text in
# cv_dir (keep them out of git: secrets/ is mounted at /app/secrets).
reader:
  enabled: false
  every_minutes: 5
  per_run: 10
  max_age_days: 14
  notify_min_match: 7
  notify_max_age_hours: 12   # older jobs (a backlog) are scored but not pushed
  read_page: true           # also fetch the job's page (JSON-LD + text); its contradictions come back as warnings
  page_chars: 12000
  notify_max_posted_days: 3  # a posting older than this is not news
  new_board_grace_hours: 36  # undated jobs from a board added this recently came with it: no push
  manatal_recent_ids: 100000  # Manatal has no dates: ids this far below the newest are old postings
  alert_every_hours: 6
  api_budget_usd: 3          # per month, for the API readers
  candidate: "The candidate lives in <city, country>. They can work remotely, or on-site/hybrid in <city>; they would move abroad only with visa sponsorship."
  cv_dir: /app/secrets/cv
  cvs: {ai: cv_ai.txt, backend: cv_backend.txt, fullstack: cv_fullstack.txt}
  readers:                   # tried in order; a failure moves to the next and notifies
    - {provider: claude-p, model: sonnet}
    - {provider: anthropic, model: claude-haiku-5-5, price: [0.10, 0.50]}
