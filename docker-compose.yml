services:
  vigia:
    build:
      context: .
      args:
        # 1 to include the Claude Code CLI (job reader through `claude -p`).
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-0}
    image: vigia:latest
    container_name: vigia
    restart: unless-stopped
    env_file:
      # SERPER_API_KEY and other secrets (git-ignored). Optional.
      - path: ./.env
        required: false
    environment:
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - vigia-data:/data
      # Your personal config (git-ignored). Falls back to the example inside the image.
      - ./config/vigia.yaml:/app/config/vigia.yaml:ro
      - ./config/vocabulary.yaml:/app/config/vocabulary.yaml:ro
      # Credential files such as the Gmail token (git-ignored). Optional.
      - ./secrets:/app/secrets:ro

  # Private web UI over the same database. Published on localhost only: open it through
  # an SSH tunnel (Docker's published ports bypass the host firewall).
  vigia-web:
    build:
      context: .
      args:
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-0}
    image: vigia:latest
    container_name: vigia-web
    restart: unless-stopped
    command: ["vigia", "web", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - vigia-data:/data
      - ./config/vigia.yaml:/app/config/vigia.yaml:ro
      - ./config/vocabulary.yaml:/app/config/vocabulary.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 1m
      timeout: 10s
      start_period: 20s

  # Optional: LinkedIn post search with a dedicated, signed-in account (source
  # linkedin_session). Off unless started with `docker compose --profile linkedin up -d`.
  # Sign in once with: docker run -it --rm -v $LINKEDIN_SESSION_DIR:/home/pwuser/.linkedin-mcp
  #   -p 127.0.0.1:6080:6080 stickerdaniel/linkedin-mcp-server:latest --login --login-viewer
  # Not published: only the vigia container reaches it.
  linkedin-mcp:
    # The upstream image, pinned, with post search clicking "Load more" (docker/linkedin-mcp).
    build: docker/linkedin-mcp
    image: vigia-linkedin-mcp
    container_name: linkedin-mcp
    profiles: [linkedin]
    restart: unless-stopped
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--no-auto-import"]
    environment:
      # The server refuses Host headers other than localhost unless named here.
      FASTMCP_HTTP_ALLOWED_HOSTS: '["linkedin-mcp", "linkedin-mcp:8000"]'
    volumes:
      - ${LINKEDIN_SESSION_DIR:-./linkedin-session}:/home/pwuser/.linkedin-mcp

volumes:
  vigia-data:
