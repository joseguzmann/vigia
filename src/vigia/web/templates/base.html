<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vigía{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Vigía</a>
    <nav>
      <a href="/" {% if page == "jobs" %}class="on"{% endif %}>Jobs</a>
      <a href="/applications" {% if page == "applications" %}class="on"{% endif %}>Applications</a>
      <a href="/experiment" {% if page == "experiment" %}class="on"{% endif %}>Experiment</a>
      <a href="/health" {% if page == "health" %}class="on"{% endif %}>Health</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
